name: Update Currently Playing

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Currently Playing
        env:
          LASTFM_API_KEY: ${{ secrets.LAST_API }}
        run: |
          python scripts/now-playing.py

- name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add currently-playing.svg
          
          git diff --cached --quiet || (git commit -m "Update currently playing" && git pull --rebase && git push)